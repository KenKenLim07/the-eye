# Production-ish compose file (no hot reload).
# Use this when you want stable containers for smoke tests or deployment-like runs.

services:
  redis:
    image: redis:7-alpine
    container_name: ph-eye-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-api
    restart: unless-stopped
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_SPACY_ANALYTICS=false
    ports:
      - "8000:8000"
    depends_on:
      - redis
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.9
    dns_search: []

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-worker
    restart: unless-stopped
    working_dir: /app/backend
    command: celery -A app.workers.celery_app:celery worker -l info -n scrape1@%h -Q scrape -c 1 -Ofair --max-tasks-per-child=1
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERYD_PREFETCH_MULTIPLIER=1
      - USE_ADV_HEADERS=true
      - USE_HUMAN_DELAY=true
      - USE_URL_FILTER=true
    depends_on:
      - redis
    shm_size: "1gb"
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.9
    dns_search: []

  worker_ml:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-worker-ml
    restart: unless-stopped
    working_dir: /app/backend
    command: celery -A app.workers.celery_app:celery worker -l info -n ml1@%h -Q ml -c 2 -Ofair --max-tasks-per-child=50
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERYD_PREFETCH_MULTIPLIER=1
      # Taglish sentiment patch (VADER lexicon extension)
      - VADER_PH_PATCH=1
      # Active sentiment engine (vader|distilbert|hybrid)
      - SENTIMENT_MODEL=hybrid
      - SENTIMENT_MODEL_VERSION=sentiment_hybrid_v1
      # DistilBERT (CPU) settings
      - DISTILBERT_MODEL_ID=distilbert-base-uncased-finetuned-sst-2-english
      - DISTILBERT_MAX_LENGTH=512
      - DISTILBERT_MAX_CHARS=2000
      - DISTILBERT_NEUTRAL_MIN_CONF=0.60
      # Hybrid routing threshold (Tagalog signal ratio)
      - TAGALOG_SIGNAL_THRESHOLD=0.06
      # Wider neutral zone for news (tune via gold set; e.g. 0.16)
      - VADER_NEUTRAL_BAND=0.16
      # Avoid over-polarizing mixed "X pero Y" news sentences
      - VADER_TL_BUT_WORDS=0
      - VADER_TL_BUT_NORMALIZE=0
      # Persist HF weights/cache across restarts
      - HF_HOME=/root/.cache/huggingface
      # Reduce SST-2 over-polarization on news-style reporting prefaces
      - DISTILBERT_NEUTRALIZE_REPORTING=1
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - redis
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.9
    dns_search: []

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-beat
    restart: unless-stopped
    working_dir: /app/backend
    command: >
      sh -c "
      rm -f celerybeat-schedule*;
      exec celery -A app.workers.celery_app:celery beat
        --loglevel=info
        --scheduler=celery.beat:PersistentScheduler
        --schedule=/app/backend/celerybeat-schedule
        --pidfile=
        --max-interval=60
      "
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - worker
    shm_size: "1gb"
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
      - 9.9.9.9
    dns_search: []
