version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: ph-eye-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-api
    restart: unless-stopped
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_SPACY_FUNDS=true
      - USE_SPACY_ANALYTICS=false
    volumes:
      - ./backend:/app/backend
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=1"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-worker
    restart: unless-stopped
    working_dir: /app/backend
    command: celery -A app.workers.celery_app:celery worker -l info -n worker1@%h -c 4 -Ofair
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERYD_PREFETCH_MULTIPLIER=1
      # Feature flags for gradual rollout (GMA)
      - USE_ADV_HEADERS=true
      - USE_HUMAN_DELAY=true
      - USE_URL_FILTER=true
    volumes:
      - ./backend:/app/backend
      - ./:/app
    depends_on:
      - redis
    shm_size: "1gb"
    ipc: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=1"

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ph-eye-beat
    restart: unless-stopped
    working_dir: /app/backend
    command: >
      sh -c "
      rm -f celerybeat-schedule* &&
      celery -A app.workers.celery_app:celery beat
        --loglevel=info
        --scheduler=celery.beat:PersistentScheduler
        --schedule=/app/backend/celerybeat-schedule
        --pidfile=
        --max-interval=60
      "
    env_file: backend/.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app/backend
      - ./:/app
    depends_on:
      - redis
      - worker
    shm_size: "1gb"
    ipc: host
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=1"
